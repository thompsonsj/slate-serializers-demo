# Build static site and deploy:
# 1) Full site → user Pages repo `thompsonsj/thompsonsj.github.io` (origin root)
# 2) Legacy meta-refresh stubs → this repo’s project Pages (`/slate-serializers-demo/*`)
#
# Requires GitHub setup — see DEPLOY.md
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run type-check

      - name: Tests (docs parity)
        run: npm run test

      - name: Build with Next.js
        run: npm run build

      - name: Verify static export
        run: |
          set -e
          test -f out/index.html
          test -f out/404.html
          test -d out/_next
          test -f out/.nojekyll
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/llms.txt

      - name: Generate legacy project-Pages redirects
        run: node scripts/generate-legacy-redirects.mjs

      - name: Upload project Pages artifact (legacy redirects)
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out-legacy-redirects
          include-hidden-files: true

      - name: Deploy site to thompsonsj.github.io (origin root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.USER_SITE_DEPLOY_TOKEN }}
          external_repository: thompsonsj/thompsonsj.github.io
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          # out/ already contains .nojekyll
          enable_jekyll: false

  deploy-legacy-redirects:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy legacy redirects to project Pages
        id: deployment
        uses: actions/deploy-pages@v4
